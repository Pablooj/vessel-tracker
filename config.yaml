ais:
  # openwaters: global live AIS over WebSocket (no API key for personal use)
  # kystverket: Norwegian Coast Guard TCP feed (the source OpenAIS uses by default)
  source: openwaters
  openwaters_url: wss://ais.openwaters.io/v1/stream
  kystverket_host: 153.44.253.27
  kystverket_port: 5631

map:
  # Map width in km. Height follows the display aspect ratio.
  width_km: 40
  center_lat: 42.240
  center_lon: -8.720
  # Place Vigo 25% from the right edge (75% from the left).
  anchor_x_fraction: 0.75
  cache_dir: .cache/coastline
  user_agent: vessel-tracker/0.1 (personal prototype)

display:
  # E-ink display resolution.
  width: 800
  height: 400
  dpi: 100
  eink: true
  refresh_ms: 2000
  stale_seconds: 36000
  show_names: false
  vessel_types:
    - cargo
